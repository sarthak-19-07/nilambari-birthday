<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Memories ♡</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at center, #52283f, #180b14 55%, #070409);
    color: #ffe8e3;
    font-family: Georgia, serif;
    overflow-x: hidden;
}

.back {
    position: fixed;
    top: 25px;
    left: 30px;
    color: #ffe0d8;
    text-decoration: none;
    border: 1px solid rgba(255,190,180,.4);
    padding: 10px 20px;
    border-radius: 30px;
    z-index: 20;
}

.page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 80px 20px 50px;
}

h1 {
    font-size: clamp(35px,6vw,65px);
    font-weight: normal;
    letter-spacing: 4px;
}

.subtitle {
    margin-top: 12px;
    opacity: .7;
    font-style: italic;
}

.gallery {
    width: min(850px, 95%);
    margin-top: 50px;
    position: relative;
    min-height: 600px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.memory {
    position: absolute;
    max-width: 80%;
    max-height: 560px;
    border-radius: 18px;
    object-fit: contain;
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
    border: 5px solid rgba(255,235,225,.9);
    opacity: 0;
    transform: scale(.9);
    transition: 1s;
}

.memory.active {
    opacity: 1;
    transform: scale(1);
}

.controls {
    display: flex;
    gap: 15px;
    margin-top: 20px;
}

button {
    border: 1px solid rgba(255,180,180,.5);
    background: rgba(255,255,255,.05);
    color: #ffe6df;
    padding: 12px 25px;
    border-radius: 30px;
    cursor: pointer;
    font-family: Georgia, serif;
    transition: .3s;
}

button:hover {
    background: rgba(255,170,170,.15);
    transform: translateY(-2px);
}

.counter {
    margin-top: 15px;
    opacity: .6;
}

.note {
    margin-top: 35px;
    text-align: center;
    font-style: italic;
    opacity: .7;
}

</style>
</head>

<body>

<a href="index.html" class="back">← Back</a>

<div class="page">

    <h1>Our Memories ♡</h1>

    <p class="subtitle">
        Every picture holds a little piece of happiness.
    </p>

    <div class="gallery">

        <!-- Change these filenames to your actual photos -->

        <img src="image/photo1.jpg"
             class="memory active"
             alt="Memory 1">

        <img src="image/DSCN1261.JPG"
             class="memory"
             alt="Memory 2">

        <img src="image/memory2.png"
             class="memory"
             alt="Memory 3">

        <img src="image/memory3.jpeg"
             class="memory"
             alt="Memory 4">

    </div>

    <div class="controls">

        <button onclick="previousPhoto()">
            ← Previous
        </button>

        <button onclick="nextPhoto()">
            Next →
        </button>

    </div>

    <div class="counter" id="counter">
        1 / 4
    </div>

    <p class="note">
        ✨ The memories will appear one by one ✨
    </p>

</div>

<script>

const photos = document.querySelectorAll(".memory");

let current = 0;

function showPhoto(index) {

    photos.forEach(photo => {
        photo.classList.remove("active");
    });

    photos[index].classList.add("active");

    document.getElementById("counter").textContent =
        `${index + 1} / ${photos.length}`;
}

function nextPhoto() {

    current++;

    if (current >= photos.length) {
        current = 0;
    }

    showPhoto(current);
}

function previousPhoto() {

    current--;

    if (current < 0) {
        current = photos.length - 1;
    }

    showPhoto(current);
}

</script>

</body>
</html>
